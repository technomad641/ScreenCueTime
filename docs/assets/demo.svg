<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="ScreenCueTime countdown demo: a fullscreen timer counts from 5 to 0, a progress ring drains around the edge, then the screen blooms and the cue fires.">
  <defs>
    <radialGradient id="glow" cx="50%" cy="34%" r="60%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- stage -->
  <rect x="8" y="8" width="1184" height="404" rx="28" fill="#0b0b0c" stroke="rgba(255,255,255,0.08)"/>
  <rect x="8" y="8" width="1184" height="404" rx="28" fill="url(#glow)"/>

  <!-- perimeter progress ring -->
  <rect x="30" y="30" width="1140" height="360" rx="30" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
  <rect x="30" y="30" width="1140" height="360" rx="30" fill="none" stroke="#0a84ff" stroke-width="2.6" stroke-linecap="round" pathLength="1" stroke-dasharray="1">
    <animate attributeName="stroke-dashoffset" values="0;1;1" keyTimes="0;0.857;1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- finish bloom -->
  <rect x="8" y="8" width="1184" height="404" rx="28" fill="url(#bloom)">
    <animate attributeName="opacity" values="0;0;0.55;0" keyTimes="0;0.857;0.9;1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- ON AIR -->
  <circle cx="60" cy="56" r="6" fill="#0a84ff">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="78" y="61" fill="#8e8e93" font-size="15" font-weight="600" letter-spacing="3">ON AIR</text>

  <!-- top-right pills -->
  <g fill="#1c1c1e" stroke="rgba(255,255,255,0.10)">
    <rect x="968" y="40" width="92" height="34" rx="17"/>
    <rect x="1070" y="40" width="86" height="34" rx="17"/>
  </g>
  <text x="1014" y="62" fill="#f5f5f7" font-size="14" font-weight="500" text-anchor="middle">Pause</text>
  <text x="1113" y="62" fill="#f5f5f7" font-size="14" font-weight="500" text-anchor="middle">Reset</text>

  <!-- label -->
  <text x="600" y="150" text-anchor="middle" fill="#6e6e73" font-size="16" font-weight="600" letter-spacing="5">
    TIME LEFT
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.857;0.857;1" dur="7s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="150" text-anchor="middle" fill="#0a84ff" font-size="16" font-weight="600" letter-spacing="5">
    TIME IS UP
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.857;0.857;1" dur="7s" repeatCount="indefinite"/>
  </text>

  <!-- countdown numerals -->
  <g text-anchor="middle" fill="#f5f5f7" font-size="128" font-weight="600" letter-spacing="2">
    <text x="600" y="290"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.1429;0.1429;1" dur="7s" repeatCount="indefinite"/>00:00:05</text>
    <text x="600" y="290"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1429;0.1429;0.2857;0.2857;1" dur="7s" repeatCount="indefinite"/>00:00:04</text>
    <text x="600" y="290"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2857;0.2857;0.4286;0.4286;1" dur="7s" repeatCount="indefinite"/>00:00:03</text>
    <text x="600" y="290"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4286;0.4286;0.5714;0.5714;1" dur="7s" repeatCount="indefinite"/>00:00:02</text>
    <text x="600" y="290"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5714;0.5714;0.7143;0.7143;1" dur="7s" repeatCount="indefinite"/>00:00:01</text>
    <text x="600" y="290"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7143;0.7143;1" dur="7s" repeatCount="indefinite"/>00:00:00</text>
  </g>

  <!-- footer note -->
  <text x="600" y="344" text-anchor="middle" fill="#6e6e73" font-size="18">
    Keep this tab open for playback.
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.857;0.857;1" dur="7s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="344" text-anchor="middle" fill="#0a84ff" font-size="18" font-weight="500">
    &#9834;  Now playing your cue
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.857;0.857;1" dur="7s" repeatCount="indefinite"/>
  </text>
</svg>
